appId: com.alegauss.piano
productName: Piano
copyright: Copyright © 2026 Alexandre Oliveira

directories:
  # build/ at the repository root holds the icon and the script that draws it.
  buildResources: ../../build
  output: ../../release

# One name per download, saying which system and which processor it is for.
# A release lists them side by side, and the defaults put "Piano-0.1.0.dmg"
# beside "Piano-0.1.0-arm64.dmg", which leaves a Mac owner guessing.
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

# Everything the app runs is already bundled: esbuild produces main and preload
# with electron as the only external, and Vite produces a self-contained
# renderer. So the package carries no node_modules at all, which is why this
# list is two lines rather than a page of exclusions.
files:
  - dist/**
  - package.json
  # Nothing here is required at runtime, and shipping 53 MB of it made the
  # asar archive unreadable: Electron found a package.json that was not JSON
  # and exited without a word. Excluded explicitly rather than by moving the
  # dependencies, because they are real build inputs and belong where they are.
  - '!node_modules/**/*'

# The sample pack is hundreds of megabytes and deliberately not in here. It is
# fetched on first run (PI54), which is the other half of the same decision:
# an installer people are expected to download has to stay small enough to.
asar: true
compression: maximum

# What the system hands to the piano when somebody double-clicks a file.
#
# A score is `.piano`, an extension of the app's own, so the app claims it
# outright on every system. MIDI and MusicXML are not: a `.mid` belongs to
# whatever the person already plays it with and a `.musicxml` to whichever
# notation editor they installed, so the piano is offered and never made the
# default. electron-builder's associations always take the default on Windows,
# which is why both are listed here only for macOS (rank Alternate) and Linux
# (a MIME type in the desktop entry, which offers without choosing), and why
# Windows gets them from build/installer.nsh as Open With entries instead.
#
# `.xml` is claimed by none of it. The app opens one handed to it by name, and
# half the files on a disk are some other XML.
fileAssociations:
  - &score
    ext: piano
    name: Piano score
    description: A score for the Piano app
    mimeType: application/x-piano-score
    role: Editor
    rank: Owner
win:
  target:
    - target: nsis
      arch: [x64]
  icon: ../../build/icon.png
  # Unsigned for now. An unsigned Electron app trips SmartScreen, and a learner
  # who has to click through a scary warning does not come back, so a
  # certificate is a real requirement before this reaches anyone.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Piano
  # MIDI under Open With, without becoming what a .mid opens with.
  include: ../../build/installer.nsh

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: ../../build/icon.png
  category: public.app-category.music
  # Gatekeeper needs notarisation, which needs an Apple account. Until then the
  # build is honest about being unsigned rather than half-configured.
  identity: null
  fileAssociations:
    - *score
    - &midi
      ext: [mid, midi]
      name: MIDI file
      mimeType: audio/midi
      role: Viewer
      rank: Alternate
    # Two entries and not one: the markup and the zip it is packed into are
    # different media types, and an entry carries a single one.
    - &musicxml
      ext: musicxml
      name: MusicXML score
      mimeType: application/vnd.recordare.musicxml+xml
      role: Viewer
      rank: Alternate
    - &mxl
      ext: mxl
      name: Compressed MusicXML score
      mimeType: application/vnd.recordare.musicxml
      role: Viewer
      rank: Alternate
  # The score type declared as the app's own, so macOS knows .piano by name
  # rather than only by its extension.
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: com.alegauss.piano.score
        UTTypeDescription: Piano score
        UTTypeConformsTo: [public.json, public.data]
        UTTypeTagSpecification:
          public.filename-extension: [piano]
          public.mime-type: application/x-piano-score

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: ../../build/icon.png
  # Otherwise it is taken from the workspace's package name, @piano/desktop,
  # which is not a file name and stops the AppImage from being built at all.
  executableName: piano
  category: Audio
  synopsis: Play scores, watch them fall, learn to play them.
  fileAssociations:
    - *score
    - *midi
    - *musicxml
    - *mxl
