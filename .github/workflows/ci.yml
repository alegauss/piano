name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast half: no process, no display, no bundle. This is what tells you
  # within a minute whether the push was sound.
  check:
    name: typecheck, lint and fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # eslint, prettier, and the two repo-wide guards: one owner for the score
      # format, one file that spells a colour.
      - name: lint
        run: npm run lint

      - name: test
        run: npm test

  # The half that starts something: a real Electron and a real browser. It
  # needs a build on disk, and on Linux it needs a display.
  live:
    name: browser and electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: install the browser the layout tests run in
        run: npx playwright install --with-deps chromium

      # The live suite refuses a bundle older than the tree, so this is not
      # optional: without it the run would stop rather than report green about
      # code nobody is looking at.
      - name: build
        run: npm run build

      - name: live tests
        run: xvfb-run --auto-servernum npm run test:live

  # Every platform the app claims to run on still packages, and the thing that
  # comes out still starts. Not on every push: it is slow, and a broken
  # installer is not something a branch introduces quietly.
  package:
    name: installers
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: AppImage
          - os: windows-latest
            artifact: nsis
          - os: macos-latest
            artifact: dmg
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: package
        run: npm run package

      # The installer existing is not the claim; the app starting is. This runs
      # the unpacked binary in smoke mode, which loads the renderer once and
      # exits, with no dev server, no toolchain and no node_modules present.
      - name: the packaged app starts
        if: runner.os == 'Windows'
        run: |
          $env:PIANO_SMOKE = '1'
          & './release/win-unpacked/Piano.exe' | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -notmatch 'renderer loaded') { exit 1 }

      - name: the packaged app starts
        if: runner.os == 'Linux'
        run: |
          chmod +x release/*.AppImage
          xvfb-run --auto-servernum env PIANO_SMOKE=1 ./release/linux-unpacked/piano | tee /tmp/out
          grep -q 'renderer loaded' /tmp/out

      # What the installer writes is read back from the registry, Launch
      # Services and the desktop entry, on the system that keeps each of them.
      # Here as well as in the release, so a macro renamed on a branch is
      # answered by that branch and not by a tag weeks later.
      - name: the installer registers what it claims
        if: runner.os != 'Linux'
        run: npm run check:associations

      # It ends by starting the installed app, which needs a display.
      - name: the installer registers what it claims
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run check:associations

      - uses: actions/upload-artifact@v4
        with:
          name: piano-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
